name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify lockfiles are current
        run: |
          python -m pip install \
            "pip==26.1.2" \
            "pip-tools==7.6.0"

          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements.lock \
            requirements.in

          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements-dev.lock \
            requirements-dev.in

          if ! git diff --exit-code -- \
            requirements.lock \
            requirements-dev.lock; then

            echo "::error::Python lockfiles are stale."
            echo "::error::Regenerate requirements.lock and requirements-dev.lock."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements-dev.lock

      - name: Run tests
        run: pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  lockfile-drift:
    name: Lockfile drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install lock tooling
        run: |
          python -m pip install \
            "pip==26.1.2" \
            "pip-tools==7.6.0"

      - name: Regenerate runtime lock
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements.lock \
            requirements.in

      - name: Regenerate development lock
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements-dev.lock \
            requirements-dev.in

      - name: Verify lockfiles are up to date
        run: |
          if ! git diff --exit-code -- \
            requirements.lock \
            requirements-dev.lock; then

            echo "::error::Python lockfiles are stale."
            echo "::error::Regenerate requirements.lock and requirements-dev.lock."
            exit 1
          fi
